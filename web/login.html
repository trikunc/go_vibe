<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Personal Notes</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>Personal Notes</h1>
      <p class="subtitle">Masuk untuk mengelola catatan pribadi Anda</p>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" required placeholder="nama@email.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Masukkan password" autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Masuk</button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="/register.html">Daftar di sini</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
